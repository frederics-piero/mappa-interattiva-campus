<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mappa Campus Universitario - Lezione 1</title>
    <!-- Collegamento al file CSS esterno -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>🗺️ Mappa del Campus Universitario</h1>

    <!-- Struttura Mappa SVG Embedded -->
    <svg
      viewBox="0 0 800 600"
      width="800"
      height="600"
      xmlns="[http://www.w3.org/2000/svg](http://www.w3.org/2000/svg)"
    >
      <!-- LAYER 1: TERRENO (Prato verde) -->
      <g id="layer-terreno">
        <rect x="0" y="0" width="800" height="600" fill="#7ec850" />
      </g>

      <!-- LAYER 2: PERCORSI PEDONALI -->
      <g id="layer-percorsi">
        <rect x="50" y="270" width="700" height="60" fill="#d1d5db" rx="4" />
        <rect x="180" y="80" width="50" height="440" fill="#d1d5db" rx="4" />
        <rect x="570" y="80" width="50" height="440" fill="#d1d5db" rx="4" />
      </g>

      <!-- LAYER 3: EDIFICI DEL CAMPUS -->
      <g id="layer-edifici">
        <!-- Uffici Amministrativi -->
        <g id="edificio-uffici">
          <rect x="70" y="80" width="100" height="140" fill="#1e3a8a" rx="6" />
          <text x="120" y="150" class="label">Uffici</text>
        </g>

        <!-- Edificio Aule -->
        <g id="edificio-aule">
          <rect x="70" y="380" width="100" height="140" fill="#2563eb" rx="6" />
          <text x="120" y="450" class="label">Aule</text>
        </g>

        <!-- Laboratori -->
        <g id="edificio-laboratori">
          <rect x="630" y="80" width="100" height="140" fill="#7c3aed" rx="6" />
          <text x="680" y="150" class="label">Laboratori</text>
        </g>

        <!-- Mensa -->
        <g id="edificio-mensa">
          <rect x="240" y="180" width="140" height="80" fill="#ea580c" rx="6" />
          <text x="310" y="220" class="label">Mensa</text>
        </g>

        <!-- Palestra -->
        <g id="edificio-palestra">
          <rect x="630" y="380" width="100" height="140" fill="#dc2626" rx="6"/>
          <text x="680" y="450" class="label">Palestra</text>
        </g>

        <!--Biblioteca-->
        <g id="edificio-biblioteca">
          <rect x="240" y="340" width="140" height="80" fill="#800080" rx="6" />
          <text x="310" y="380" class="label">Biblioteca</text>
        </g>
      </g>
    </svg>
  </body>
</html>
